        first_date = sorted(i["date"] for i in items)[0]
        slug = items[0]["slug"]
        notify(
            f"ð¥ ÙÙØ§Ø¹ÙØ¯ Ø¬Ø¯ÙØ¯Ø© ÙÙ ÙÙÙØ³ ({len(items)} Ø­ÙÙØ©)",
