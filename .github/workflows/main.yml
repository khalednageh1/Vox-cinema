    if "--test" in sys.argv:
        notify("â Ø¨ÙØª ÙÙÙØ³ Ø´ØºØ§Ù", "ÙÙ ÙØµÙØªÙÙ Ø§ÙØ±Ø³Ø§ÙØ© Ø¯Ù ÙØ¨ÙÙ Ø§ÙØ¥Ø´Ø¹Ø§Ø±Ø§Øª ÙØªØ¸Ø¨Ø·Ø©.", priority=3)
        print("test notification sent")
        return 0

    if not NTFY_TOPIC:
        print("ERROR: set NTFY_TOPIC", file=sys.stderr)
        return 2

    state = load_state()
    current, errors = {}, []
    for slug in SLUGS:
        try:
            _, found = collect_movie(slug)
            current.update(found)
            print(f"{slug}: {len(found)} sessions")
