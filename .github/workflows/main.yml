    if not state["initialized"] and not errors:
        # First successful run = baseline, so you are not spammed with what already exists.
        if NOTIFY_EXISTING and new_keys:
            notify("ð ÙÙØ§Ø¹ÙØ¯ ÙÙØ¬ÙØ¯Ø© Ø­Ø§ÙÙÙØ§", format_new([current[k] for k in new_keys]),
                   click=f"{BASE}/movies/{SLUGS[0]}#showtimes")
        else:
            notify(
                "â Ø¨Ø¯Ø£Øª Ø§ÙÙØ±Ø§ÙØ¨Ø©",
                f"Ø¨Ø±Ø§ÙØ¨: {', '.join(SLUGS)}\nØ§ÙÙØªØ±Ø©: {nice_date(DATE_FROM)} â {nice_date(DATE_TO)}\n"
                f"Ø§ÙØ­ÙÙØ§Øª Ø§ÙÙÙØ¬ÙØ¯Ø© Ø­Ø§ÙÙÙØ§ ÙÙ Ø§ÙÙØªØ±Ø© Ø¯Ù: {len(current)}\n"
                "ÙØªÙØµÙÙ Ø±Ø³Ø§ÙØ© Ø£ÙÙ ÙØ§ ÙØ¸ÙØ± ÙÙØ¹Ø¯ Ø¬Ø¯ÙØ¯.",
